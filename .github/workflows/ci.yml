name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
        # ubuntu-latest (26.04) has no Python 3.9 build; test 3.9 on 24.04 instead.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
            pypdf: ">=6,<7"  # oldest supported Python and pypdf together
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.pypdf
        run: python -m pip install "pypdf[crypto]${{ matrix.pypdf }}"
      - run: python -c "import pypdf; print('pypdf', pypdf.__version__)"
      - run: python -m pytest -q
      - name: CLI smoke test
        run: python -m bookletize --version
