[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bookletize"
version = "1.0.0"
description = "Turn PDF pages (or chapters) into foldable, saddle-stitched booklets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["pypdf>=6"]
keywords = ["pdf", "booklet", "imposition", "print", "saddle-stitch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bookletize = "bookletize.cli:main"

[project.gui-scripts]
bookletize-gui = "bookletize.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
